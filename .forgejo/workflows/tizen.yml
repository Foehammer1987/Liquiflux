# Forgejo copy of .github/workflows/tizen.yml: builds Liquiflux for Samsung TVs (Tizen) on
# pull requests that touch the app, by hand (Run workflow), and on main. One TPK per Tizen
# version group (see TIZEN.md and tools/build-tizen.sh), uploaded as the run's artifacts, never
# released: Samsung TVs get Liquiflux from Samsung's store through Seller Office.
#
# Runs on the self-hosted runner (label `docker`) in an Ubuntu 22.04 container made for
# Actions runners (it has sudo, node and the usual tools). The SDK refuses to install as root,
# so tools/ci/tizen-build.sh runs as a normal user made in the job.
#
# Signing. Without secrets, each run makes a throwaway Tizen certificate, which proves the
# build works but installs on no Samsung TV. For TVs and the store, add these secrets in
# Forgejo (the repository's Settings > Actions > Secrets) from Tizen's Certificate Manager:
#   TIZEN_AUTHOR_P12_BASE64        author.p12, base64-encoded
#   TIZEN_AUTHOR_PASSWORD
#   TIZEN_DISTRIBUTOR_P12_BASE64   distributor.p12, base64-encoded
#   TIZEN_DISTRIBUTOR_PASSWORD
# Keep the author certificate safe: every update must be signed with the same one.
#
# flutter-tizen is pinned by commit. The Tizen SDK installer comes from download.tizen.org and
# is checked against TIZEN_SDK_SHA256 when that is set.

name: tizen

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - app/**
      - packages/**
      - tools/build-tizen.sh
      - tools/ci/tizen-build.sh
      - .forgejo/workflows/tizen.yml
  workflow_dispatch:

env:
  # flutter-tizen 3.47.5-tizen.1.0.1 (Flutter 3.47.5).
  FLUTTER_TIZEN_COMMIT: cd5ad06b3e7ba93a392a3636a3b896aee5483eed
  TIZEN_SDK_URL: https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin
  TIZEN_SDK_SHA256: ""

jobs:
  tpk:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "6.0"
            packages: NativeToolchain-Gcc-9.2 IOT-Headed-6.0-NativeAppDevelopment-CLI
          - api: "6.5"
            packages: NativeToolchain-Gcc-9.2 IOT-Headed-6.5-NativeAppDevelopment-CLI
          - api: "10.0"
            packages: NativeToolchain-Gcc-9.2 TIZEN-10.0-NativeAppDevelopment-CLI
    steps:
      - uses: actions/checkout@v4
      - name: Build as a normal user (the Tizen SDK won't install as root)
        env:
          TIZEN_API: ${{ matrix.api }}
          TIZEN_PACKAGES: ${{ matrix.packages }}
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libncurses5 python3.8 libpython3.8 gettext \
            libkf5itemmodels5 libkf5kiowidgets5 libkchart2 dbus-x11 gnome-keyring
          id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder -H \
            --preserve-env=TIZEN_API,TIZEN_PACKAGES,TIZEN_SDK_URL,TIZEN_SDK_SHA256,FLUTTER_TIZEN_COMMIT,AUTHOR_P12,AUTHOR_PASSWORD,DISTRIBUTOR_P12,DISTRIBUTOR_PASSWORD \
            bash "$GITHUB_WORKSPACE/tools/ci/tizen-build.sh"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: liquiflux-tizen-${{ matrix.api }}
          path: dist/*.tpk
          if-no-files-found: error
