# Builds Liquiflux for Windows and Android TV on every push and pull request.
#
# A push to main whose app version (app/pubspec.yaml) has no GitHub release yet publishes one,
# tagged v<version>, with the Windows installer, the Windows zip and both Android TV APKs.
# To ship a new version: bump `version:` in app/pubspec.yaml and push to main.
#
# Android signing: add these repository secrets (Settings > Secrets and variables > Actions)
# so every release is signed with the same key and installs as an update over the last one:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# tools/export-signing-key.ps1 prints these from the key tools/build-android.ps1 made.
# Without them, pull requests and branch builds use a throwaway debug key, and releases
# leave the APKs out rather than ship ones that can't be updated later.
#
# Third-party actions are pinned by commit.
name: build-and-release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: console_core tests
        working-directory: packages/console_core
        run: dart pub get && dart test
      - name: console_ui tests
        working-directory: packages/console_ui
        run: flutter pub get && flutter test
      - name: App analyze and tests
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Liquiflux $v" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      version: ${{ steps.version.outputs.version }}

  windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        # Trimming unused icons corrupts the Lucide icon font, so keep it whole.
        run: |
          flutter pub get
          flutter build windows --release --no-tree-shake-icons
      - name: Zip and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = 'app/build/windows/x64/runner/Release'
          # Ship the Visual C++ runtime next to the exe, so PCs without the redistributable
          # can run it too (Flutter's documented way of bundling it).
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          # The zip unpacks to a Liquiflux folder.
          $stage = Join-Path $env:RUNNER_TEMP 'Liquiflux'
          Copy-Item $release $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath dist/Liquiflux-windows-x64.zip
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc.Source "/DAppVersion=$env:VERSION" "/DAppSource=$((Resolve-Path $release).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" tools/installer/liquiflux.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Get-ChildItem dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquiflux-windows
          path: dist/*
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/key.properties"
          echo "LIQUIFLUX_KEY_PROPERTIES=$dir/key.properties" >> "$GITHUB_ENV"
      - name: Build APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --no-tree-shake-icons
          mkdir -p ../dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/Liquiflux-android-tv-$abi.apk"
          done
          ls -l ../dist
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquiflux-android-tv
          path: dist/*
          if-no-files-found: error
    outputs:
      signed: ${{ env.HAS_KEY }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.test.outputs.version }}
      SIGNED: ${{ needs.android.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this version released yet?
        id: check
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        if: steps.check.outputs.publish == 'true'
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "No Android signing secrets: this release has no APKs." | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f dist/*.apk
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # Release notes: this version's CHANGELOG section, then the download guide.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-downloads.md >> notes.md
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Liquiflux $VERSION" --notes-file notes.md
