# Forgejo copy of .github/workflows/collection-pack.yml: rebuilds the TV collection pack
# (app/assets/collections/tv-pack.json) from Wikipedia, Wikidata and TVmaze.
#   - On the 1st of each month and by hand (Run workflow) on main: commits the new pack and
#     tools/collection-pack/report.md to a branch, collection-pack/<date>, and opens a pull
#     request into main. Nothing is committed to main directly.
#   - When the builder or its source list changes on another branch: commits the pack back to
#     that branch, as on GitHub.
# Commits are made as github-actions[bot], so they can go on to GitHub later.
# Pushes and pull requests made with the workflow's own token don't start other workflows:
# on the pull request, run build (Run workflow) on its branch before merging.
name: Collection pack

on:
  push:
    branches-ignore: [main]
    paths:
      - tools/collection-pack/build_pack.py
      - tools/collection-pack/sources.json
      - .forgejo/workflows/collection-pack.yml
  workflow_dispatch:
    inputs:
      only:
        description: Only these collection ids (comma-separated); empty = all
        required: false
  schedule:
    - cron: "17 6 1 * *"

concurrency:
  group: collection-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # API answers are cached for a month so a rebuild after a sources.json edit is quick.
      - uses: actions/cache@v4
        with:
          path: tools/collection-pack/.cache
          key: collection-pack-${{ github.run_id }}
          restore-keys: collection-pack-
      - name: Expire the cache monthly
        run: |
          stamp=tools/collection-pack/.cache/month
          if [ -f "$stamp" ] && [ "$(cat $stamp)" != "$(date +%Y-%m)" ]; then rm -rf tools/collection-pack/.cache; fi
          mkdir -p tools/collection-pack/.cache && date +%Y-%m > $stamp
      - name: Build the pack
        run: python3 tools/collection-pack/build_pack.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Commit the pack
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/collections/tv-pack.json tools/collection-pack/report.md
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          today=$(date -u +%Y-%m-%d)
          git commit -m "Collection pack: rebuild ($today)"
          if [ "$BRANCH" != "main" ]; then
            # Someone may have pushed while the pack was building.
            for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
            exit 1
          fi
          head="collection-pack/$today"
          git push --force origin "HEAD:refs/heads/$head"
          if curl -fsS -H "Authorization: token $TOKEN" "$API/pulls?state=open&limit=50" |
              jq -e --arg h "$head" 'any(.[]; .head.ref == $h)' > /dev/null; then
            echo "Pull request for $head is already open; its branch was updated."
            exit 0
          fi
          body=$(jq -n --arg head "$head" --arg t "Collection pack: rebuild ($today)" \
            '{base: "main", head: $head, title: $t,
              body: "Monthly rebuild of the TV collection pack. See tools/collection-pack/report.md for what changed.\n\nRun the build workflow on this branch before merging (pull requests opened by a workflow do not start CI on their own)."}')
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$body" "$API/pulls" | jq -r '.html_url'
