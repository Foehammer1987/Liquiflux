name: console_app
description: "Liquiflux, a Plex client with Seerr requests built in."
publish_to: none
version: 1.0.10+68

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  console_core:
    path: ../packages/console_core
  console_ui:
    path: ../packages/console_ui
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  flutter_local_notifications: ^22.3.2
  http: ^1.6.0
  crypto: ^3.0.6
  # QR codes for the TV sign-ins (Trakt's activate page, the phone link). Pure Dart, pinned.
  qr: 4.0.0
  # Open Watch Party rooms (see packages/console_core).
  openwatchparty: 1.1.0
# Our copy of media_kit_video 2.0.1 with the Windows picture handed to Flutter without
# tearing (see packages/media_kit_video/LIQUIFLUX.md). Android and the rest are unchanged.
dependency_overrides:
  media_kit_video:
    path: ../packages/media_kit_video
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Trusted roots for mpv's https checks (lib/services/mpv_tls.dart).
    - assets/tls/cacert.pem
