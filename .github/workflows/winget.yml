# Sends a released version of Liquiflux to WinGet (microsoft/winget-pkgs) as a pull request.
# Run by hand only: after a GitHub release, first click Sync fork on Foehammer1987/winget-pkgs,
# then Actions > WinGet > Run workflow with the version (e.g. 1.0.14). Nothing runs it
# automatically, so the account never opens pull requests on other repositories on its own.
#
# Needs a WINGET_TOKEN secret (a classic GitHub token with the public_repo scope). The pull
# request comes from a fork of microsoft/winget-pkgs under the token's account (wingetcreate
# makes the fork). Without the secret this is skipped.
#
# Downloaded tools are pinned by checksum, actions by commit.
name: WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to send to WinGet (e.g. 1.0.14)
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
      # microsoft/winget-create v1.12.13.0
      WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
      WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
    steps:
      - name: Is v${{ inputs.version }} released on GitHub?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.0.14 (no v, no -rc), got: $VERSION"
            exit 1
          fi
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > /dev/null; then
            echo "::error::There is no GitHub release v$VERSION. Release it first (push the version to main), then run this again."
            exit 1
          fi
          echo "Sending v$VERSION to WinGet." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No WinGet token
        if: env.HAS_TOKEN != 'true'
        shell: bash
        run: echo "No WINGET_TOKEN secret, so v$VERSION was not sent to WinGet." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false
      - name: Manifests
        if: env.HAS_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern Liquiflux-Setup-x64.exe --dir dl
          sha=$(sha256sum dl/Liquiflux-Setup-x64.exe | cut -d' ' -f1)
          date=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt | cut -c1-10)
          dir=$(tools/winget/make-manifests.sh "$VERSION" "$sha" "$date" winget)
          echo "MANIFESTS=$dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_TOKEN == 'true'
        with:
          name: winget-manifests
          path: winget
      - name: Submit to microsoft/winget-pkgs
        if: env.HAS_TOKEN == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          Invoke-WebRequest $env:WINGETCREATE_URL -OutFile wingetcreate.exe -UseBasicParsing
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne $env:WINGETCREATE_SHA256) { throw 'wingetcreate.exe does not match its checksum' }
          ./wingetcreate.exe submit --no-open --prtitle "New version: Liquiflux.Liquiflux version $env:VERSION" --token $env:WINGET_TOKEN $env:MANIFESTS
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }
          "Sent v$env:VERSION to WinGet: see the pull requests on microsoft/winget-pkgs." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
