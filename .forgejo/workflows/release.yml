# Forgejo releases. Pushing a tag v<version> builds the Android TV APKs, the Windows zip and
# installer and the three Samsung TPKs, signed like build.yml and tizen.yml, and publishes them
# with one SHA256SUMS.txt as a release on this Forgejo:
#   v1.0.15-rc1, v1.0.15-rc2, ...  a pre-release (test builds of a version)
#   v1.0.15                        a normal release, with that version's CHANGELOG.md section
# The tag's version must match `version:` in app/pubspec.yaml (v1.0.15-rc1 needs 1.0.15).
# Run workflow publishes the tag named in its input (the tag must exist already).
#
# Forgejo only: this never touches GitHub. GitHub makes its own release (v<version>, no rc tags)
# when the commit reaches GitHub's main; see docs/CI.md.
#
# The jobs repeat build.yml and tizen.yml (keep them in step). Tests aren't run again here: the
# tagged commit was tested on its pull request and on main. The windows job waits in the queue
# while the Windows runner's PC is off, and the release waits for it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.0.15-rc1); it must already exist
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.47.7"
  FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  ANDROID_CMDLINE_TOOLS: "13114758"
  ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
  # flutter-tizen 3.47.5-tizen.1.0.1 (Flutter 3.47.5).
  FLUTTER_TIZEN_COMMIT: cd5ad06b3e7ba93a392a3636a3b896aee5483eed
  TIZEN_SDK_URL: https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin
  TIZEN_SDK_SHA256: ""

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches the app version
        run: |
          v=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          case "$TAG" in
            "v$v"|"v$v"-rc*) echo "Releasing $TAG (app version $v)." ;;
            *) echo "::error::Tag $TAG doesn't match app/pubspec.yaml version $v (expected v$v or v$v-rcN)."; exit 1 ;;
          esac

  android:
    needs: check
    runs-on: docker
    container:
      # The prebuilt image from tools/ci/flutter-image (see build.yml).
      image: liquiflux-flutter-ci:1
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # As in build.yml: media_kit's libmpv download has no timeout of its own.
      JAVA_TOOL_OPTIONS: -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=120000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Only the pub packages and media_kit's libmpv jars, as in build.yml.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ env.FLUTTER_VERSION }}-android-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ env.FLUTTER_VERSION }}-android-
      - uses: actions/cache@v4
        with:
          path: app/build/media_kit_libs_android_video/v*
          key: libmpv-android-${{ hashFiles('app/pubspec.lock') }}
      - name: Flutter and Android SDK
        run: tools/ci/setup-flutter.sh android
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/key.properties"
          echo "LIQUIFLUX_KEY_PROPERTIES=$dir/key.properties" >> "$GITHUB_ENV"
      - name: No signing key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::No Android signing secrets: a release must not ship debug-signed APKs."
          exit 1
      - name: Build APKs
        working-directory: app
        run: |
          flutter pub get
          # Trimming unused icons corrupts the Lucide icon font, so keep it whole.
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --no-tree-shake-icons
          v=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          mkdir -p ../dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/Liquiflux-$v-android-tv-$abi.apk"
          done
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: release-android-tv
          path: dist/*
          if-no-files-found: error

  windows:
    needs: check
    # The Windows runner on a PC (label `windows`, host mode); see build.yml and docs/CI.md.
    runs-on: windows
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Flutter version
        shell: powershell
        run: |
          $v = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          if ($v -ne $env:FLUTTER_VERSION) { Write-Output "::warning::This runner has Flutter $v, CI expects $env:FLUTTER_VERSION." }
          flutter --version
      - name: Build
        shell: powershell
        working-directory: app
        # Trimming unused icons corrupts the Lucide icon font, so keep it whole.
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed' }
          flutter build windows --release --no-tree-shake-icons
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
      - name: Zip and installer
        shell: powershell
        run: |
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = 'app/build/windows/x64/runner/Release'
          # Ship the Visual C++ runtime next to the exe, as the GitHub release build does.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          $stage = Join-Path ([IO.Path]::GetTempPath()) "Liquiflux-release-$env:GITHUB_RUN_ID\Liquiflux"
          Remove-Item -Recurse -Force (Split-Path $stage) -ErrorAction SilentlyContinue
          Copy-Item $release $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "dist/Liquiflux-$version-windows-x64.zip"
          Remove-Item -Recurse -Force (Split-Path $stage)
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 6 (ISCC.exe) is not installed on this runner' }
          & $iscc "/DAppVersion=$version" "/DAppSource=$((Resolve-Path $release).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" tools/installer/liquiflux.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Rename-Item dist/Liquiflux-Setup-x64.exe "Liquiflux-$version-Setup-x64.exe"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  tizen:
    needs: check
    runs-on: docker
    container:
      # The prebuilt image from tools/ci/tizen-image (see tizen.yml).
      image: liquiflux-tizen-ci:1
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "6.0"
            packages: NativeToolchain-Gcc-9.2 IOT-Headed-6.0-NativeAppDevelopment-CLI
          - api: "6.5"
            packages: NativeToolchain-Gcc-9.2 IOT-Headed-6.5-NativeAppDevelopment-CLI
          - api: "10.0"
            packages: NativeToolchain-Gcc-9.2 TIZEN-10.0-NativeAppDevelopment-CLI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Samsung certificate
        env:
          HAS_CERT: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 != '' && secrets.TIZEN_DISTRIBUTOR_P12_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo "::error::No Samsung certificate secrets: a release must not ship throwaway-signed TPKs."
            exit 1
          fi
      - name: Build as a normal user (the Tizen SDK won't install as root)
        env:
          TIZEN_API: ${{ matrix.api }}
          TIZEN_PACKAGES: ${{ matrix.packages }}
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          if [ ! -f /etc/liquiflux-tizen-ci ]; then
            sudo add-apt-repository -y ppa:deadsnakes/ppa
            sudo apt-get update
            sudo apt-get install -y libncurses5 python3.8 libpython3.8 gettext \
              libkf5itemmodels5 libkf5kiowidgets5 libkchart2 dbus-x11 gnome-keyring \
              dotnet-sdk-8.0
          fi
          id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder -H \
            --preserve-env=TIZEN_API,TIZEN_PACKAGES,TIZEN_SDK_URL,TIZEN_SDK_SHA256,FLUTTER_TIZEN_COMMIT,AUTHOR_P12,AUTHOR_PASSWORD,DISTRIBUTOR_P12,DISTRIBUTOR_PASSWORD \
            bash "$GITHUB_WORKSPACE/tools/ci/tizen-build.sh"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: release-tizen-${{ matrix.api }}
          path: dist/*.tpk
          if-no-files-found: error

  publish:
    needs: [android, windows, tizen]
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts
      - name: Files and sums
        run: |
          mkdir -p release
          find artifacts -type f ! -name SHA256SUMS.txt -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes
        run: |
          v=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          # The CHANGELOG.md section for this version, without its heading.
          awk -v h="## $v" '$0 == h { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          case "$TAG" in
            *-rc*) { printf 'Test build of %s. Not for general use: it may change before the release.\n\n' "$v"; cat notes.md; } > notes.tmp && mv notes.tmp notes.md ;;
          esac
          [ -s notes.md ] || echo "Liquiflux $v." > notes.md
      - name: Publish the Forgejo release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          case "$TAG" in *-rc*) pre=true ;; *) pre=false ;; esac
          auth="Authorization: token $TOKEN"
          # Re-running replaces this tag's release and its files.
          old=$(curl -fsS -H "$auth" "$API/releases/tags/$TAG" | jq -r '.id // empty' || true)
          if [ -n "$old" ]; then curl -fsS -X DELETE -H "$auth" "$API/releases/$old"; fi
          body=$(jq -n --arg tag "$TAG" --arg name "Liquiflux ${TAG#v}" --rawfile notes notes.md --argjson pre "$pre" \
            '{tag_name: $tag, name: $name, body: $notes, prerelease: $pre, draft: false}')
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$API/releases" | jq -r .id)
          for f in release/*; do
            echo "Uploading $(basename "$f")"
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$API/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done
          echo "Published $TAG (prerelease: $pre): ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
