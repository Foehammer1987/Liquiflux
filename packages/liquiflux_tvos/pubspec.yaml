name: liquiflux_tvos
description: "Liquiflux's Apple TV platform bits: user defaults, leaving to the Home screen."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      tvos:
        pluginClass: LiquifluxTvosPlugin
