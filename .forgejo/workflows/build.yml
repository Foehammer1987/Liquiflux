# Day-to-day CI on Forgejo: tests, Android TV and phone/tablet builds for every pull request, every push to
# main, and by hand (Run workflow). Builds only, nothing is published: the APKs are the run's
# artifacts. Public releases (Windows installer, APKs, WinGet) stay in
# .github/workflows/release.yml for when the code is pushed to GitHub. Forgejo reads only
# .forgejo/workflows once that folder exists, and GitHub never reads it, so the two don't clash.
#
# The Linux jobs run on the self-hosted runner (label `docker`) in liquiflux-flutter-ci, a local
# image built from tools/ci/flutter-image/Dockerfile on the runner's Docker host: Ubuntu 24.04
# (catthehacker act-24.04) with the pinned Flutter, JDK 17, the Android SDK and Gradle's downloads
# already in it. tools/ci/setup-flutter.sh only installs what the image lacks, so pointing
# `image:` back at ghcr.io/catthehacker/ubuntu:act-24.04 still works (just slower). Only the pub
# packages are cached between runs. When FLUTTER_VERSION or ANDROID_CMDLINE_TOOLS change,
# rebuild the image with a new tag (see the Dockerfile) and bump `image:` below.
#
# Android signing: add these secrets in Forgejo (the repository's Settings > Actions > Secrets)
# so the APKs are signed with the same key as the PC builds and install as updates over them:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# tools/export-signing-key.ps1 prints them. Without them the APKs use a throwaway debug key.
# Secrets are not given to pull requests from forks.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"
  FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  ANDROID_CMDLINE_TOOLS: "13114758"
  ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee

jobs:
  test:
    runs-on: docker
    container:
      # Ubuntu 24.04 with Node.js for the actions. (flutter_tester crashed now and then on exit
      # in a Debian bookworm container.)
      image: liquiflux-flutter-ci:1
      # Docker's default 64 MB /dev/shm is too small for many test processes at once.
      options: --shm-size=2g
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Only the pub packages: Flutter is in the image. (A new key prefix, so the old bundles
      # with /opt/flutter in them are never restored over the image's copy.)
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ env.FLUTTER_VERSION }}-test-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ env.FLUTTER_VERSION }}-test-
      - name: Flutter
        run: tools/ci/setup-flutter.sh
      - name: Apple targets match app/apple
        run: dart tools/apple_sync.dart --check
      - name: console_core tests
        working-directory: packages/console_core
        run: dart pub get && dart test
      - name: console_ui tests
        working-directory: packages/console_ui
        run: flutter pub get && flutter test --concurrency=4
      - name: App analyze and tests
        working-directory: app
        # A few test processes at a time: the runner's host has many cores, and a test process
        # per core at once has crashed flutter_tester (segmentation fault while loading).
        run: flutter pub get && flutter analyze && flutter test --concurrency=4
      - name: App tests as a TV (remote-control focus)
        working-directory: app
        run: CONSOLE_TV=1 flutter test test/tv_home_test.dart test/updates_focus_test.dart test/profiles_tv_test.dart test/tv_settings_test.dart test/tracking_focus_test.dart

  android:
    needs: test
    runs-on: docker
    container:
      # Ubuntu 24.04 with Node.js for the actions. (flutter_tester crashed now and then on exit
      # in a Debian bookworm container.)
      image: liquiflux-flutter-ci:1
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # media_kit's libmpv download (a plain Java URL stream inside Gradle) has no timeout of its
      # own and once hung a job for its whole hour on a stalled connection; fail it fast instead.
      JAVA_TOOL_OPTIONS: -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=120000
    steps:
      - uses: actions/checkout@v4
      # Only the pub packages: Flutter, the Android SDK and Gradle's downloads are in the image.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ env.FLUTTER_VERSION }}-android-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ env.FLUTTER_VERSION }}-android-
      # media_kit_libs_android_video downloads its libmpv .jar files from GitHub releases into
      # the plugin's build folder on every build unless they're already there with the right
      # MD5, so keep them between runs (a new media_kit version means new jars, hence the key).
      - uses: actions/cache@v4
        with:
          path: app/build/media_kit_libs_android_video/v*
          key: libmpv-android-${{ hashFiles('app/pubspec.lock') }}
      - name: Flutter and Android SDK
        run: tools/ci/setup-flutter.sh android
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/key.properties"
          echo "LIQUIFLUX_KEY_PROPERTIES=$dir/key.properties" >> "$GITHUB_ENV"
      - name: No signing key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::No Android signing secrets, so these APKs use a debug key and won't install over the PC builds."
      - name: Build APKs
        working-directory: app
        run: |
          flutter pub get
          # Trimming unused icons corrupts the Lucide icon font, so keep it whole.
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --no-tree-shake-icons
          v=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          mkdir -p ../dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/Liquiflux-$v-android-tv-$abi.apk"
          done
          # The phone and tablet build: same app id, its own manifest (see android/app/src/mobile).
          # 64-bit only: every phone Google Play still serves new apps to is 64-bit.
          flutter build apk --release --split-per-abi --target-platform android-arm64 --no-tree-shake-icons \
            --dart-define=LIQUIFLUX_FORM=mobile --android-project-arg=liquiflux.form=mobile
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/Liquiflux-$v-android-mobile-arm64-v8a.apk"
          (cd ../dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: liquiflux-android-tv
          path: |
            dist/*-android-tv-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: liquiflux-android-mobile
          path: dist/*-android-mobile-*.apk
          if-no-files-found: error

  windows:
    needs: test
    # A Windows runner on a PC (label `windows`, host mode: no container), with Flutter,
    # Visual Studio's C++ tools and Inno Setup 6 installed. Jobs wait in the queue while that
    # PC is off; the Linux jobs don't depend on this one.
    runs-on: windows
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Flutter version
        shell: powershell
        run: |
          $v = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          if ($v -ne $env:FLUTTER_VERSION) { Write-Output "::warning::This runner has Flutter $v, CI expects $env:FLUTTER_VERSION." }
          flutter --version
      - name: Build
        shell: powershell
        working-directory: app
        # Trimming unused icons corrupts the Lucide icon font, so keep it whole.
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed' }
          flutter build windows --release --no-tree-shake-icons
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
      - name: Zip and installer
        shell: powershell
        run: |
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = 'app/build/windows/x64/runner/Release'
          # Ship the Visual C++ runtime next to the exe, as the GitHub release build does.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          $stage = Join-Path ([IO.Path]::GetTempPath()) "Liquiflux-ci-$env:GITHUB_RUN_ID\Liquiflux"
          Remove-Item -Recurse -Force (Split-Path $stage) -ErrorAction SilentlyContinue
          Copy-Item $release $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "dist/Liquiflux-$version-windows-x64.zip"
          Remove-Item -Recurse -Force (Split-Path $stage)
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 6 (ISCC.exe) is not installed on this runner' }
          & $iscc "/DAppVersion=$version" "/DAppSource=$((Resolve-Path $release).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" tools/installer/liquiflux.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Rename-Item dist/Liquiflux-Setup-x64.exe "Liquiflux-$version-Setup-x64.exe"
          Push-Location dist
          $sums = Get-ChildItem -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: liquiflux-windows
          path: dist/*
          if-no-files-found: error
