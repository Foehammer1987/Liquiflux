# Rebuilds the TV collection pack (app/assets/collections/tv-pack.json) from Wikipedia,
# Wikidata and TVmaze, then commits it and tools/collection-pack/report.md back to the
# branch it ran on. Runs when the builder or its source list changes and by hand (Run
# workflow). The monthly rebuild runs on Forgejo (.forgejo/workflows/collection-pack.yml),
# which opens a pull request there, so GitHub never commits on its own.
name: Collection pack

on:
  push:
    branches-ignore: [main]
    paths:
      - tools/collection-pack/build_pack.py
      - tools/collection-pack/sources.json
      - .github/workflows/collection-pack.yml
  workflow_dispatch:
    inputs:
      only:
        description: Only these collection ids (comma-separated); empty = all
        required: false

permissions:
  contents: write

concurrency:
  group: collection-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # API answers are cached for a month so a rebuild after a sources.json edit is quick.
      - uses: actions/cache@v4
        with:
          path: tools/collection-pack/.cache
          key: collection-pack-${{ github.run_id }}
          restore-keys: collection-pack-
      - name: Expire the cache monthly
        run: |
          stamp=tools/collection-pack/.cache/month
          if [ -f "$stamp" ] && [ "$(cat $stamp)" != "$(date +%Y-%m)" ]; then rm -rf tools/collection-pack/.cache; fi
          mkdir -p tools/collection-pack/.cache && date +%Y-%m > $stamp
      - name: Build the pack
        run: python3 tools/collection-pack/build_pack.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Commit the pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/collections/tv-pack.json tools/collection-pack/report.md
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Collection pack: rebuild ($(date -u +%Y-%m-%d))"
          # Someone may have pushed while the pack was building.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
