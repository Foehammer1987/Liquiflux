name: console_app
description: "Liquiflux, a Plex client with Seerr requests built in."
publish_to: none
version: 1.0.20+78

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  console_core:
    path: ../packages/console_core
  console_ui:
    path: ../packages/console_ui
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  flutter_local_notifications: ^22.3.2
  http: ^1.6.0
  crypto: ^3.0.6
  # QR codes for the TV sign-ins (Trakt's activate page, the phone link). Pure Dart, pinned.
  qr: 4.0.0
  # Open Watch Party rooms (see packages/console_core).
  openwatchparty: 1.1.0
  # Samsung TVs (Tizen), built with flutter-tizen (see TIZEN.md). Each of these is a Tizen-only
  # plugin: the Android, Windows and Linux builds don't include them.
  # Samsung's hardware player, in place of mpv (services/avplay_player.dart).
  video_player_avplay: 0.8.22
  # Keeps the TV's screensaver away while a video plays (wakelock_plus already comes with
  # media_kit_video; only the Tizen side is new).
  wakelock_plus: ^1.8.1
  wakelock_plus_tizen: 2.1.5
  # Tizen versions of plugins the app already uses.
  flutter_secure_storage_tizen: 0.1.6
  path_provider_tizen: 2.3.3
  url_launcher_tizen: 2.1.9
# Our copy of media_kit_video 2.0.1 with the Windows picture handed to Flutter without
# tearing (see packages/media_kit_video/LIQUIFLUX.md). Android and the rest are unchanged.
dependency_overrides:
  media_kit_video:
    path: ../packages/media_kit_video
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Trusted roots for mpv's https checks (lib/services/mpv_tls.dart).
    - assets/tls/cacert.pem
    # TV networks and programming blocks (tools/collection-pack builds it).
    - assets/collections/tv-pack.json
