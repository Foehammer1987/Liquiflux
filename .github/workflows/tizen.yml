# Builds Liquiflux for Samsung TVs (Tizen) on pull requests that touch the app, by hand
# (Run workflow), and on main: one TPK per Tizen version group (see TIZEN.md and
# tools/build-tizen.sh). The TPKs are uploaded as the run's artifacts, not released: Samsung
# TVs get Liquiflux from Samsung's store, which takes the packages through Seller Office.
#
# Signing. Without secrets, each run makes a throwaway Tizen certificate, which proves the
# build works but installs on no Samsung TV. For TVs and the store, make a Samsung
# certificate in Tizen's Certificate Manager (author + distributor; add a TV's DUID to the
# distributor one to install on it in developer mode) and add these repository secrets:
#   TIZEN_AUTHOR_P12_BASE64        author.p12, base64-encoded
#   TIZEN_AUTHOR_PASSWORD
#   TIZEN_DISTRIBUTOR_P12_BASE64   distributor.p12, base64-encoded
#   TIZEN_DISTRIBUTOR_PASSWORD
# Keep the author certificate safe: every update must be signed with the same one, or the
# store and the TV treat it as another app.
#
# Third-party actions and flutter-tizen are pinned by commit. The Tizen SDK installer comes
# from download.tizen.org and is checked against TIZEN_SDK_SHA256.
name: tizen

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - app/**
      - packages/**
      - tools/build-tizen.sh
      - .github/workflows/tizen.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # flutter-tizen 3.47.5-tizen.1.0.1 (Flutter 3.47.5).
  FLUTTER_TIZEN_COMMIT: cd5ad06b3e7ba93a392a3636a3b896aee5483eed
  TIZEN_SDK_URL: https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin
  TIZEN_SDK_SHA256: ""

jobs:
  tpk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "6.0"
            packages: NativeToolchain-Gcc-9.2 IOT-Headed-6.0-NativeAppDevelopment-CLI
          - api: "6.5"
            packages: NativeToolchain-Gcc-9.2 IOT-Headed-6.5-NativeAppDevelopment-CLI
          - api: "10.0"
            packages: NativeToolchain-Gcc-9.2 Tizen-10.0-NativeAppDevelopment-CLI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tizen SDK
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libncurses5 python3.8 libpython3.8 gettext \
            libkf5itemmodels5 libkf5kiowidgets5 libkchart2 dbus-x11 gnome-keyring
          curl -fsSL "$TIZEN_SDK_URL" -o install.bin
          sha="$(sha256sum install.bin | cut -d' ' -f1)"
          echo "Tizen SDK installer sha256: $sha"
          if [ -n "$TIZEN_SDK_SHA256" ] && [ "$sha" != "$TIZEN_SDK_SHA256" ]; then
            echo "::error::The Tizen SDK installer changed (expected $TIZEN_SDK_SHA256)."
            exit 1
          fi
          chmod a+x install.bin
          ./install.bin --accept-license "$HOME/tizen-studio"
          rm install.bin
          "$HOME/tizen-studio/package-manager/package-manager-cli.bin" install ${{ matrix.packages }}
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$HOME/tizen-studio/tools" >> "$GITHUB_PATH"
      - name: flutter-tizen
        run: |
          git clone https://github.com/flutter-tizen/flutter-tizen.git "$HOME/flutter-tizen"
          git -C "$HOME/flutter-tizen" checkout --detach "$FLUTTER_TIZEN_COMMIT"
          echo "$HOME/flutter-tizen/bin" >> "$GITHUB_PATH"
      - name: Certificate profile
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          keys="$RUNNER_TEMP/tizen-keys"
          mkdir -p "$keys"
          if [ -n "$AUTHOR_P12" ] && [ -n "$DISTRIBUTOR_P12" ]; then
            echo "Signing with the repository's Samsung certificate."
            echo "$AUTHOR_P12" | base64 -d > "$keys/author.p12"
            echo "$DISTRIBUTOR_P12" | base64 -d > "$keys/distributor.p12"
            dbus-run-session -- bash -c "
              echo tizen | gnome-keyring-daemon --unlock >/dev/null &&
              tizen security-profiles add -n liquiflux -a '$keys/author.p12' -p \"\$AUTHOR_PASSWORD\" \
                -d '$keys/distributor.p12' -dp \"\$DISTRIBUTOR_PASSWORD\" -A
            "
          else
            echo "::notice::No Samsung certificate secrets: signing with a throwaway certificate. These TPKs won't install on a TV."
            dbus-run-session -- bash -c "
              echo tizen | gnome-keyring-daemon --unlock >/dev/null &&
              tizen certificate -a liquiflux -p liquiflux -f throwaway &&
              tizen security-profiles add -n liquiflux -a \"\$HOME/tizen-studio-data/keystore/author/throwaway.p12\" -p liquiflux -A
            "
          fi
      - name: Doctor
        run: flutter-tizen doctor -v
      - name: Build
        env:
          TIZEN_SECURITY_PROFILE: liquiflux
        run: dbus-run-session -- bash -c "echo tizen | gnome-keyring-daemon --unlock >/dev/null && tools/build-tizen.sh ${{ matrix.api }}"
      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/tizen-keys" "$HOME/tizen-studio-data/keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquiflux-tizen-${{ matrix.api }}
          path: dist/*.tpk
          if-no-files-found: error
